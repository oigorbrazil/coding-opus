<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Coding Opus · Controle remoto</title>
  <style>
    :root { --canvas:#fff; --surface:#f2f2f7; --ink:#1f1f1f; --muted:#6d6d72; --line:#e2e2e3; --action:#0071e3; --fill:#efeff0; --focus:#8e8e93; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme:light; }
    @media(prefers-color-scheme:dark) { :root { --canvas:#121214; --surface:#1c1c1f; --ink:#f5f5f7; --muted:#98989f; --line:#3a3a3c; --action:#0091ff; --fill:#2c2c2e; color-scheme:dark; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-size:14px; line-height:1.55; }
    main { max-width:960px; margin:auto; padding:32px 24px max(32px,env(safe-area-inset-bottom)); }
    header { display:flex; justify-content:space-between; align-items:center; gap:24px; border-bottom:1px solid var(--line); padding-bottom:24px; margin-bottom:28px; }
    h1 { font-size:24px; line-height:1.25; margin:0 0 6px; font-weight:600; letter-spacing:-.025em; }
    h2 { font-size:18px; margin:0 0 16px; font-weight:600; }
    p { margin:0; }
    .muted, small { color:var(--muted); }
    .workspace { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(220px,1fr); gap:40px; }
    section { min-width:0; }
    label { display:block; font-weight:500; margin-bottom:6px; }
    input, select, textarea, button { font:inherit; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--canvas); color:var(--ink); padding:11px 12px; min-height:44px; }
    textarea { resize:vertical; min-height:140px; line-height:1.55; caret-color:var(--action); }
    input::placeholder, textarea::placeholder { color:var(--muted); }
    button { min-height:44px; border:1px solid var(--line); background:var(--fill); color:var(--ink); border-radius:999px; padding:10px 18px; cursor:pointer; font-weight:500; }
    button:hover { filter:brightness(.96); }
    button:disabled { cursor:default; opacity:.5; }
    .primary { background:var(--action); color:white; border-color:var(--action); }
    :focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    ::selection { background:var(--action); color:white; }
    .field { margin-bottom:18px; }
    .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .row > .field { flex:1; min-width:130px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    #connection { max-width:480px; margin-bottom:36px; }
    #connection .row { align-items:stretch; flex-wrap:nowrap; }
    #token { min-width:0; }
    #notice { margin:0 0 20px; padding:12px 14px; border-left:3px solid var(--action); background:var(--surface); border-radius:0 12px 12px 0; overflow-wrap:anywhere; }
    .watch { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .watch small { flex:1 1 140px; line-height:1.4; }
    .watch button { border-radius:12px; padding-inline:12px; }
    #activity { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
    #activity:has(p:empty) { margin:0; padding:0; border:0; }
    #activity p { flex:1 1 150px; overflow-wrap:anywhere; }
    #activity button { border-radius:12px; padding-inline:12px; }
    #sessions { display:flex; flex-direction:column; }
    .session { text-align:left; border:0; border-radius:0; border-bottom:1px solid var(--line); background:transparent; padding:14px 0; min-width:0; width:100%; overflow-wrap:anywhere; }
    .session[aria-current="true"] { color:var(--action); }
    .session strong { display:block; font-weight:500; }
    .session small { display:block; margin-top:3px; }
    #output { white-space:pre-wrap; overflow-wrap:anywhere; margin:16px 0 0; font-family:inherit; max-height:60vh; overflow:auto; padding:16px; background:var(--surface); border-radius:12px; scrollbar-color:var(--muted) var(--surface); }
    #result { margin-top:36px; border-top:1px solid var(--line); padding-top:24px; }
    #status { font-variant-numeric:tabular-nums; }
    .check-option { display:flex; align-items:center; gap:8px; margin:0 0 18px; font-weight:400; }
    .check-option input { width:18px; height:18px; min-height:0; flex:none; accent-color:var(--action); }
    #gate { display:grid; gap:10px; margin-top:16px; padding:14px; border:1px solid var(--line); border-radius:12px; }
    #gateQuestion { overflow-wrap:anywhere; }
    [hidden] { display:none !important; }
    @media(max-width:640px) { main { padding:24px 20px max(24px,env(safe-area-inset-bottom)); } header { gap:12px; align-items:flex-start; } h1 { font-size:24px; } .workspace { grid-template-columns:1fr; gap:32px; } #disconnect { padding-inline:14px; } .actions button { flex:1; } #switch { flex-basis:100%; } }
    @media(prefers-reduced-motion:no-preference) { #result { animation:reveal .2s ease-out; } @keyframes reveal { from { opacity:.6; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Coding Opus</h1><p class="muted">Controle remoto dos seus agentes</p></div>
    <button id="disconnect" hidden>Desconectar</button>
  </header>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <form id="connection">
    <h2>Conectar ao computador</h2>
    <label for="token">Chave de acesso</label>
    <div class="row"><input id="token" type="password" autocomplete="off" required placeholder="Cole a chave configurada no computador"><button class="primary">Conectar</button></div>
    <p class="muted" style="margin-top:10px">A chave fica nesta aba até você desconectar.</p>
  </form>
  <div id="app" hidden>
    <div class="workspace">
      <section>
        <h2 id="composerTitle">Novo pedido</h2>
        <form id="composer">
          <div class="field"><label for="project">Projeto</label><select id="project" required></select></div>
          <div class="row">
            <div class="field"><label for="agent">Agente</label><select id="agent"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></div>
            <div class="field"><label for="mode">Permissão</label><select id="mode"><option value="read-only">Somente leitura</option><option value="write">Permitir alterações</option></select></div>
          </div>
          <label id="isolation" class="check-option" hidden><input id="isolate" type="checkbox"> Trabalhar em uma cópia Git separada (worktree)</label>
          <div class="field"><label for="prompt">O que você quer fazer?</label><textarea id="prompt" required maxlength="50000" placeholder="Descreva o pedido e o resultado esperado."></textarea></div>
          <div class="actions"><button id="send" class="primary">Iniciar tarefa</button><button id="newSession" type="button" hidden>Nova conversa</button></div>
        </form>
      </section>
      <section>
        <h2>Conversas recentes</h2>
        <div class="watch">
          <button id="notifications" type="button">Ativar notificações</button>
          <small id="notificationHelp" role="status">Receba avisos enquanto o painel estiver aberto e conectado.</small>
        </div>
        <div id="activity">
          <p id="activityMessage" role="status" aria-live="polite" aria-atomic="true"></p>
          <button id="openActivity" type="button" hidden>Ver tarefa</button>
        </div>
        <div id="sessions"><p class="muted">Nenhuma conversa iniciada por aqui.</p></div>
      </section>
    </div>
    <section id="result" hidden>
      <div class="row"><h2 style="margin:0">Andamento</h2><span id="status" class="muted"></span></div>
      <div class="actions"><button id="refresh">Atualizar</button><button id="stop">Interromper</button><button id="switch">Continuar na outra IA</button></div>
      <form id="gate" hidden>
        <strong>Checagem pendente</strong>
        <p id="gateQuestion"></p>
        <label for="gateNote">Observação opcional</label>
        <input id="gateNote" type="text" maxlength="1000">
        <div class="row"><button type="submit" value="pass">Passou</button><button type="submit" value="fail">Falhou</button></div>
      </form>
      <pre id="output" tabindex="0" aria-label="Resultado e andamento da tarefa"></pre>
    </section>
  </div>
</main>
<script>
  const el = id => document.getElementById(id);
  const basePath = location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');
  const endpoint = basePath + 'mcp';
  const stateNames = {starting:'Preparando',running:'Em execução',stopping:'Interrompendo',needs_input:'Aguardando sua checagem',succeeded:'Resposta disponível',failed:'Falhou',interrupted:'Interrompida',stopped:'Interrompida',timed_out:'Tempo esgotado',skipped:'Não iniciada'};
  const activeStates = new Set(['starting','running','stopping','needs_input']);
  const attentionStates = new Set(['needs_input','failed','timed_out','skipped']);
  let token = '', sessions = [], selected = null, taskId = null, busy = false, sending = false, retryId = null, transfer = false;
  let activitySession = null, activityTask = null, notificationWorker = null, gateKey = null;
  let listVersion = 0, listKey = '', watching = false, polling = false, deciding = false, newestSeen = '';
  const observed = new Map();
  const projectNames = new Map();
  const notice = text => { el('notice').textContent = text; el('notice').hidden = !text; };

  function activityType(session) {
    if (session.task_state === 'needs_input') return 'gate';
    if (session.task_state === 'succeeded' && !session.task_attention) return 'complete';
    return session.task_attention || attentionStates.has(session.task_state) ? 'attention' : null;
  }

  function showActivity(session, type, count, sendNotification) {
    const project = projectNames.get(session.project) || session.project;
    const message = type === 'gate' ? 'Uma checagem precisa da sua decisão.' :
      type === 'attention' ? 'Uma tarefa precisa de atenção.' : 'Uma tarefa tem resposta disponível.';
    activitySession = session.id;
    activityTask = session.task_id;
    const more = count > 1 ? ` Há mais ${count - 1} na lista.` : '';
    el('activityMessage').textContent = `${project} · ${message}${more}`;
    el('openActivity').hidden = false;
    if (sendNotification && notificationWorker && Notification.permission === 'granted') {
      notificationWorker.showNotification('Coding Opus', {
        body: message + more,
        tag: 'coding-opus-activity'
      }).catch(() => {
        el('notificationHelp').textContent = 'O aviso ficou no painel. O navegador não entregou a notificação.';
      });
    }
  }

  function trackActivity(next) {
    const changed = [];
    for (const session of next) {
      if (!session.task_id) continue;
      const event = activityType(session);
      const appeared = !observed.has(session.task_id) && (session.updated || '') > newestSeen;
      const transitioned = observed.has(session.task_id) && observed.get(session.task_id) !== event;
      if (watching && event && (appeared || transitioned)) {
        changed.push({session,event});
      }
      if (activityTask === session.task_id && !event) {
        activitySession = activityTask = null;
        el('activityMessage').textContent = '';
        el('openActivity').hidden = true;
      }
      observed.set(session.task_id,event);
    }
    for (const session of next) if ((session.updated || '') > newestSeen) newestSeen = session.updated;
    if (changed.length) {
      showActivity(changed[0].session,changed[0].event,changed.length,true);
    } else if (!watching) {
      const pending = next.find(session=>session.task_state === 'needs_input');
      if (pending) showActivity(pending,'gate',1,false);
    }
    const currentIds = new Set(next.map(session=>session.task_id));
    for (const id of observed.keys()) if (!currentIds.has(id)) observed.delete(id);
    watching = true;
  }

  el('notifications').onclick=async()=>{
    const button=el('notifications');
    const help=el('notificationHelp');
    if(notificationWorker){
      notificationWorker=null;
      button.textContent='Ativar notificações';
      help.textContent='Receba avisos enquanto o painel estiver aberto e conectado.';
      return;
    }
    if(!window.isSecureContext || !('Notification' in window) || !('serviceWorker' in navigator)){
      help.textContent='As notificações do dispositivo não estão disponíveis neste navegador. Acompanhe os avisos aqui.';
      return;
    }
    button.disabled=true;
    try {
      const permission=await Notification.requestPermission();
      if(permission!=='granted'){
        help.textContent='Sem permissão para notificar. Os avisos continuam aqui no painel.';
        return;
      }
      const registration=await navigator.serviceWorker.register(basePath+'notification-worker.js',{scope:basePath});
      const ready=await navigator.serviceWorker.ready;
      if(ready.scope!==registration.scope)throw Error('Escopo de notificação inválido.');
      notificationWorker=ready;
      button.textContent='Pausar notificações';
      help.textContent='Notificações ativas nesta aba enquanto o painel estiver aberto e conectado.';
    } catch {
      help.textContent='Não foi possível ativar notificações. Os avisos continuam aqui no painel.';
    } finally {button.disabled=false;}
  };
  async function message(method, params = {}) {
    const response = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream','Authorization':'Bearer '+token,'MCP-Protocol-Version':'2025-11-25'},body:JSON.stringify({jsonrpc:'2.0',id:crypto.randomUUID(),method,params})});
    if (response.status === 401) throw Error('Chave inválida. Confira a chave de acesso no computador.');
    if (!response.ok) throw Error('Não foi possível completar o pedido. Confira a conexão e tente novamente.');
    const data = await response.json();
    if (data.error) throw Error(data.error.message);
    return data.result;
  }
  async function tool(name, args = {}) {
    const result = await message('tools/call', {name,arguments:args});
    if (result.isError) throw Error(result.content[0].text);
    return result.structuredContent.result;
  }
  function renderSessions() {
    const key = JSON.stringify([selected?.id,sessions.map(session=>[session.id,session.agent,session.project,session.title,session.task_state])]);
    if (key===listKey) return;
    listKey=key;
    const focused=document.activeElement?.dataset.session;
    el('sessions').replaceChildren();
    if (!sessions.length) { const p = document.createElement('p'); p.className='muted'; p.textContent='Nenhuma conversa iniciada por aqui.'; el('sessions').append(p); }
    for (const session of sessions) {
      const button = document.createElement('button'); button.className='session'; button.type='button'; button.setAttribute('aria-current',String(selected?.id===session.id));
      button.dataset.session=session.id;
      const title = document.createElement('strong'); title.textContent=(session.agent==='codex'?'Codex':'Claude Code')+' · '+(projectNames.get(session.project)||session.project);
      const description = document.createElement('small'); description.textContent=(session.title?session.title+' · ':'')+(stateNames[session.task_state]||session.task_state||'Sem tarefa');
      button.append(title,description); button.onclick=()=>choose(session).catch(error=>notice(error.message)); el('sessions').append(button);
      if (focused===session.id) button.focus({preventScroll:true});
    }
  }
  async function refreshSessions() {
    const version=++listVersion;
    const next=await tool('list_sessions');
    if(version!==listVersion)return;
    trackActivity(next);
    sessions=next;
    const current=selected && sessions.find(session=>session.id===selected.id);
    if(current){selected=current;taskId=current.task_id;}
    renderSessions();
  }
  function configureComposer() {
    el('composerTitle').textContent=transfer?'Continuar na outra IA':selected?'Continuar conversa':'Novo pedido';
    el('project').disabled=!!selected; el('agent').disabled=!!selected&&!transfer; el('mode').disabled=!!selected;
    el('isolation').hidden=!!selected || el('mode').value!=='write';
    el('newSession').hidden=!selected;
    el('send').textContent=transfer?'Transferir contexto':selected?'Enviar mensagem':'Iniciar tarefa';
    el('send').disabled=busy||sending;
    el('switch').disabled=busy||!selected;
    el('stop').disabled=!busy;
  }
  async function choose(session) {
    selected=session; transfer=false; taskId=session.task_id;
    busy=activeStates.has(session.task_state);
    retryId=null;
    el('project').value=session.project; el('agent').value=session.agent; el('mode').value=session.mode;
    configureComposer(); renderSessions(); await refreshTask();
  }
  el('openActivity').onclick=()=>{
    const session=sessions.find(item=>item.id===activitySession);
    if(session)choose(session).then(()=>el('result').scrollIntoView({block:'start'})).catch(error=>notice(error.message));
  };
  async function refreshTask() {
    if (!taskId) return;
    const requestedId=taskId;
    const task=await tool('get_task',{task_id:requestedId});
    if(requestedId!==taskId)return;
    busy=activeStates.has(task.state);
    el('result').hidden=false; el('status').textContent=stateNames[task.state]||task.state;
    const gate=task.state==='needs_input' && task.gate?.id && task.gate?.question ? task.gate : null;
    el('gate').hidden=!gate;
    if(gate){
      const key=gate.id;
      if(gateKey!==key){gateKey=key;el('gateNote').value='';}
      el('gateQuestion').textContent=gate.question;
    } else {gateKey=null;}
    el('output').textContent=task.result||task.error||task.output_tail||(busy?'A resposta aparecerá aqui.':'Sem resposta disponível.');
    configureComposer();
  }
  el('connection').onsubmit=async event=>{
    event.preventDefault(); token=el('token').value.trim(); notice('Conectando…');
    try {
      await message('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'coding-opus-mobile',version:'36.0.0'}});
      const projects=await tool('projects'); el('project').replaceChildren();
      projects.forEach(project=>{const option=document.createElement('option'); option.value=project.id; option.textContent=project.name; el('project').append(option); projectNames.set(project.id,project.name);});
      el('app').hidden=false; el('connection').hidden=true; el('disconnect').hidden=false; el('token').value='';
      await refreshSessions(); notice('');
    } catch(error) { notice(error.message); }
  };
  el('composer').onsubmit=async event=>{
    event.preventDefault(); if(sending||busy)return; sending=true; configureComposer(); retryId ||=crypto.randomUUID();
    try {
      const prompt=el('prompt').value;
      const args={prompt,request_id:retryId}; let task;
      if(transfer)task=await tool('continue_with',{...args,session_id:selected.id,agent:el('agent').value});
      else if(selected)task=await tool('send_message',{...args,session_id:selected.id});
      else {
        const mode=el('mode').value;
        const isolate=mode==='write' && el('isolate').checked;
        task=await tool('start_agent',{...args,project:el('project').value,agent:el('agent').value,mode,...(isolate?{isolate}:{})});
      }
      retryId=null; taskId=task.id; el('prompt').value=''; notice('');
      if(!observed.has(task.id))observed.set(task.id,null);
      selected=null;
      await refreshSessions();
      selected=sessions.find(session=>session.id===task.session_id); transfer=false; renderSessions(); await refreshTask();
    } catch(error) { notice(error.message); } finally {sending=false;configureComposer();}
  };
  for(const id of ['prompt','project','agent','mode','isolate'])el(id).addEventListener('input',()=>{retryId=null;});
  el('mode').onchange=configureComposer;
  el('newSession').onclick=()=>{
    selected=null;transfer=false;busy=false;taskId=null;retryId=null;
    el('mode').value='read-only';el('isolate').checked=false;
    el('result').hidden=true;configureComposer();renderSessions();notice('');
  };
  el('refresh').onclick=()=>poll(true);
  el('stop').onclick=async()=>{try{await tool('stop_task',{task_id:taskId});await poll(true);}catch(error){notice(error.message);}};
  el('gate').onsubmit=async(event)=>{
    event.preventDefault();
    if(deciding || !gateKey || !['pass','fail'].includes(event.submitter?.value))return;
    deciding=true;
    const buttons=[...el('gate').querySelectorAll('button')];
    buttons.forEach(button=>{button.disabled=true;});
    try{
      await tool('resolve_gate',{task_id:taskId,gate_id:gateKey,passed:event.submitter.value==='pass',note:el('gateNote').value.trim()});
      await refreshTask();
      await refreshSessions();
    }catch(error){notice(error.message);}
    finally{deciding=false;buttons.forEach(button=>{button.disabled=false;});}
  };
  el('switch').onclick=()=>{transfer=true;el('agent').value=selected.agent==='codex'?'claude':'codex';configureComposer();el('prompt').focus();};
  el('disconnect').onclick=()=>location.reload();
  async function poll(force=false){
    if(el('app').hidden || polling || sending || deciding)return;
    polling=true;
    try{
      const lastId=taskId, lastState=selected?.task_state;
      await refreshSessions();
      if(taskId&&(force||busy||taskId!==lastId||selected?.task_state!==lastState))await refreshTask();
    }catch(error){if(force||el('notice').hidden)notice(error.message);}
    finally{polling=false;}
  }
  setInterval(poll,4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)void poll(true);});
</script>
</body>
</html>
